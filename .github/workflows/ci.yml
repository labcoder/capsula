name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: ['batch/**']
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in CI: smaller caches, faster links, and nothing here needs a debugger.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'cloud-ci') && (github.event.action != 'labeled' || github.event.label.name == 'cloud-ci'))
    name: fmt, deny, clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect dependency changes
        id: dependencies
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT -in @('schedule', 'workflow_dispatch')) {
            'changed=True' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:HEAD)) { throw 'Missing dependency comparison head' }
          $base = $env:BASE
          if ($env:EVENT -eq 'push') {
            $base = git merge-base origin/main $env:HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not find the main merge base' }
          }
          if ([string]::IsNullOrWhiteSpace($base)) { throw 'Missing dependency comparison base' }
          $changed = git diff --name-only "$base...$env:HEAD" -- Cargo.lock Cargo.toml '**/Cargo.toml' deny.toml .cargo/config.toml .github/workflows/ci.yml
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare dependency files' }
          "changed=$([bool]$changed)" >> $env:GITHUB_OUTPUT
          if (-not $changed) {
            Write-Output "::notice::cargo deny skipped: no dependency or CI configuration changes since $base"
          }
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache doesn't hash a virtual workspace's root manifest, where the profiles live.
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        if: steps.dependencies.outputs.changed == 'True'
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo deny --locked check
        if: steps.dependencies.outputs.changed == 'True'
      - run: cargo xtask check-vendor
      - run: cargo xtask notices --check
      - run: cargo xtask check-core
      - run: cargo clippy -p kumochi-shell-core --lib --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux_portable:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    name: Linux portable (fmt, clippy, offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install ALSA build headers if needed
        run: |
          if ! pkg-config --exists alsa; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends libasound2-dev
          fi
      - name: Install only the pinned toolchain
        run: |
          rustup toolchain install
          pinned="$(rustup show active-toolchain)"
          pinned="${pinned%% *}"
          installed="$(rustup toolchain list --quiet)"
          while read -r toolchain; do
            if [[ "$toolchain" != "$pinned" ]]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done <<< "$installed"
          [[ "$(rustup toolchain list --quiet)" == "$pinned" ]]
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Clippy (portable packages)
        run: >-
          cargo clippy --locked --all-targets
          -p kumochi-protocol -p kumochi-scene -p kumochi-audio
          -p kumochi-shell-core -p kumochi-brain -p xtask
          -- -D warnings
      - name: Tests (offline, loopback only)
        run: |
          sudo -n /usr/bin/unshare --net -- /bin/bash -euc '
            /usr/sbin/ip link set lo up
            exec /usr/bin/setpriv --reuid "$SUDO_UID" --regid "$SUDO_GID" --clear-groups --no-new-privs -- "$@"
          ' -- /usr/bin/env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 TZ=UTC \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            CARGO_TERM_COLOR="$CARGO_TERM_COLOR" CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            CARGO_PROFILE_DEV_DEBUG="$CARGO_PROFILE_DEV_DEBUG" CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            CARGO_NET_OFFLINE=true RUST_TEST_THREADS=4 \
            cargo test --locked --offline --no-fail-fast \
              -p kumochi-protocol -p kumochi-scene -p kumochi-audio \
              -p kumochi-shell-core -p kumochi-brain -p xtask

  # Keeps the single job's id, so its cache key and the cache main already saved still match.
  check:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'cloud-ci') && (github.event.action != 'labeled' || github.event.label.name == 'cloud-ci'))
    name: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache doesn't hash a virtual workspace's root manifest, where the profiles live.
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
        env:
          # The tests mostly wait on processes, pipes and deadlines, so 4 threads keep 2 vCPUs busy.
          RUST_TEST_THREADS: 4
          # The tests' scratch folders make many durable writes, which the work disk takes 7-10x faster than C:.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: cargo test -p gpui-pre-windows --locked --lib vsync
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
