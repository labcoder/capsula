[workspace]
resolver = "3"
members = ["crates/protocol", "crates/scene", "crates/brain", "crates/shell-core", "crates/shell", "xtask"]
# Vendored third-party crates build as dependencies, not members, so workspace lints skip them.
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
kumochi-protocol = { path = "crates/protocol" }
kumochi-scene = { path = "crates/scene" }
kumochi-shell-core = { path = "crates/shell-core" }
fluent-bundle = "0.16"
getrandom = { version = "0.3", features = ["std"] }
gpui-kit = "0.8.1"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
smallvec = "=1.16.4"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
unic-langid = "0.9"
zeroize = "1"

# Lints start from BeautifulRust's lints/lints.toml (MIT, github.com/morganlinton/BeautifulRust
# at a9cdcfa94d13), then add Kumochi's rules: unwrap denied, unsafe only in platform modules.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.lyon_tessellation]
debug-assertions = false

[profile.release.package.lyon_tessellation]
debug-assertions = false

# The dependencies the brain's tests spend their CPU in, optimised in dev and test builds. Only
# these: `"*"` made a cold build 3.5 times slower and every CI run rebuilds the vendored crates.
[profile.dev.package]
image = { opt-level = 2 }
zune-jpeg = { opt-level = 2 }
libsqlite3-sys = { opt-level = 2 }
rusqlite = { opt-level = 2 }
serde_json = { opt-level = 2 }
sha2 = { opt-level = 2 }
ring = { opt-level = 2 }
memchr = { opt-level = 2 }
postcard = { opt-level = 2 }
base64 = { opt-level = 2 }

# The gpui-kit revision S1 built and measured, over registry gpui-pre 0.3.10. Upgrading it is a
# deliberate change that reruns P1's window tests.
[patch.crates-io]
ptts = { path = "vendor/ptts" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "99576db58ec8103417c41a092e891b4022d24e7e" }
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "99576db58ec8103417c41a092e891b4022d24e7e" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "99576db58ec8103417c41a092e891b4022d24e7e" }
gpui-component-macros = { git = "https://github.com/longbridge/gpui-kit", rev = "99576db58ec8103417c41a092e891b4022d24e7e" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "99576db58ec8103417c41a092e891b4022d24e7e" }
# GPUI's Windows backend with the idle-wake fix (docs/development/gpui-patch.md). It must match
# the gpui-pre version gpui-kit resolves; `cargo xtask check-vendor` fails CI when it stops applying.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
