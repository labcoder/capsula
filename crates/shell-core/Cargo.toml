[package]
name = "kumochi-shell-core"
description = "What Kumochi's shell knows and decides, with no UI framework in its dependency tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1"
async-channel = "2"
fluent-bundle.workspace = true
kumochi-protocol.workspace = true
kumochi-scene.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unic-langid.workspace = true
zeroize.workspace = true

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
cpal = { version = "=0.18.2", default-features = false }
kumochi-audio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
kumochi-storage = { path = "../storage" }
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
keyring.workspace = true
kumochi-storage = { path = "../storage" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dev-dependencies]
kumochi-brain = { path = "../brain", features = ["test-support"] }

[features]
# The fixtures the shell's tests share with the core's.
test-support = []

[lints]
workspace = true
