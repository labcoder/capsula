[package]
name = "kumochi-protocol"
description = "The brain-to-shell messages, ids, secrets and product constants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gate tools' identity (OSC-680). Enabled only on a gate tool's command line, never here or in
# another manifest: a workspace build would then ship it.
gate-identity = []

[dependencies]
kumochi-scene.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
