[package]
name = "kumochi-brain"
description = "Kumochi's headless brain, kumochid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kumochid"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fluent-bundle.workspace = true
kumochi-protocol.workspace = true
kumochi-scene.workspace = true
kumochi-storage.workspace = true
getrandom.workspace = true
httparse = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
keyring.workspace = true
# Spoken replies. Pinned exactly: the voice owner relies on xn 0.2.13's own pool API.
ptts = { version = "=0.6.0", default-features = false, features = ["hf"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# hooks: the progress handler that stops a purge's copy.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
# Tool schemas, from the structs that parse each tool's arguments.
schemars = "1.2"
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror.workspace = true
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zeroize = { workspace = true, features = ["serde"] }
unic-langid.workspace = true
url = "2"
webbrowser = "1"
xn = { version = "=0.2.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true

[features]
# Lets another crate's tests drive a coordinator with no store behind it, and lets an
# outside harness time the UIA reader on a window it owns (platform::WindowSession).
test-support = []

[dev-dependencies]
kumochi-storage = { workspace = true, features = ["test-support"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
