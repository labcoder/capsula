[package]
name = "kumochi-brain"
description = "Kumochi's headless brain, kumochid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kumochid"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fluent-bundle.workspace = true
kumochi-protocol.workspace = true
kumochi-scene.workspace = true
getrandom.workspace = true
httparse = "1.10"
jsonwebtoken = { version = "9", default-features = false }
keyring.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# hooks: the progress handler that stops a purge's copy.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zeroize = { version = "1", features = ["serde"] }
unic-langid.workspace = true
url = "2"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[features]
# Lets another crate's tests drive a coordinator with no store behind it.
test-support = []

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
