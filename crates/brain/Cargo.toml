[package]
name = "capsula-brain"
description = "Capsula's headless brain, capsulad."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "capsulad"
path = "src/main.rs"

[dependencies]
capsula-protocol.workspace = true
getrandom.workspace = true
keyring.workspace = true
# hooks: the progress handler that stops a purge's copy.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
serde.workspace = true
serde_json = "1"
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
