[package]
name = "kumochi-brain"
description = "Kumochi's headless brain, kumochid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kumochid"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fluent-bundle.workspace = true
kumochi-protocol.workspace = true
getrandom.workspace = true
keyring.workspace = true
# hooks: the progress handler that stops a purge's copy.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zeroize = { version = "1", features = ["serde"] }
unic-langid.workspace = true
url = "2"
webbrowser = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
