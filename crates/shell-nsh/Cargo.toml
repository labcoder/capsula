[package]
name = "kumochi-shell-nsh"
description = "Kumochi's NativeShell shell, kumochi-nsh: the shell that will replace the GPUI one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kumochi-nsh"
path = "src/main.rs"

[dependencies]
async-channel = "2"
kumochi-protocol.workspace = true
kumochi-scene.workspace = true
kumochi-shell-core.workspace = true
nsh-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true

[dev-dependencies]
# The link fixtures the core shares with its shells' tests.
kumochi-shell-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
