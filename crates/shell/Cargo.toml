[package]
name = "kumochi-shell"
description = "Kumochi's shell, kumochi: everything the user sees, hears and touches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kumochi"
path = "src/main.rs"

[dependencies]
async-channel = "2"
kumochi-protocol.workspace = true
kumochi-scene.workspace = true
kumochi-shell-core.workspace = true
lyon = "=1.0.19"
gpui-kit.workspace = true
# GPUI's own image type, for Kumo's frames; the same version GPUI already builds.
image = { version = "0.25.10", default-features = false }
keyring.workspace = true
raw-window-handle = { version = "0.6", features = ["std"] }
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = "=0.3.10"
kumochi-storage = { path = "../storage" }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGWindow",
] }
time = "0.3.55"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "=0.3.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
gate-draw-replay = []

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
kumochi-brain = { path = "../brain", features = ["test-support"] }
kumochi-shell-core = { path = "../shell-core", features = ["test-support"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
